name: Playwright Orca

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-orca:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
            # ubuntu-22.04,
            ubuntu-24.04,
            # ubuntu-26.04 # Playwright doesn't support Firefox on 26.04 currently
          ]
        browser: [firefox]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      # TODO: all installation handled by @guidepup/setup
      - run: |
          apt-get update

          apt-get install -y \
            orca \
            xvfb \
            dbus-x11 \
            libglib2.0-bin

            # ============================================================
            # Speech Dispatcher
            # ============================================================

            export SPEECHD_DIR=/tmp/guidepup-speechd

            mkdir -p \
              "${SPEECHD_DIR}/modules" \
              "${SPEECHD_DIR}/logs" \
              "${SPEECHD_DIR}/run"

            # ------------------------------------------------------------
            # Speech Dispatcher configuration
            # ------------------------------------------------------------

            cat > "${SPEECHD_DIR}/speechd.conf" <<'EOF'
            # Guidepup Speech Dispatcher PoC

            AddModule "guidepup" "guidepup" "guidepup.conf"
            DefaultModule guidepup
            EOF

            # ------------------------------------------------------------
            # Custom module
            # ------------------------------------------------------------

            # TODO: Replace file-based Orca output capture with a streaming transport (Unix
            # domain socket preferred) so the Guidepup Orca module can consume speech
            # events in real time.
            cat > "${SPEECHD_DIR}/modules/guidepup" <<'PY'
            #!/usr/bin/env python3

            import sys

            LOG = "/tmp/speech.log"

            def log(text):
                with open(LOG, "a", buffering=1) as f:
                    f.write(text + "\n")

            def send(text):
                log(f"OUT: {text!r}")
                sys.stdout.write(text + "\n")
                sys.stdout.flush()

            def receive_data():
                lines = []

                while True:
                    line = sys.stdin.readline()

                    if not line:
                        return None

                    line = line.rstrip("\n")
                    log(f"IN: {line!r}")

                    if line == ".":
                        break

                    if line == "..":
                        line = "."

                    lines.append(line)

                return "\n".join(lines)

            while True:
                line = sys.stdin.readline()

                if not line:
                    break

                line = line.rstrip("\n")
                log(f"IN: {line!r}")

                if line == "INIT":
                    send("299 OK LOADED")

                elif line == "AUDIO":
                    send("207 OK RECEIVING AUDIO SETTINGS")

                    data = receive_data()

                    if data is None:
                        break

                    log(f"AUDIO SETTINGS: {data!r}")
                    send("203 OK AUDIO SETTINGS RECEIVED")

                elif line == "LOGLEVEL":
                    send("200 OK RECEIVING LOGLEVEL")

                    data = receive_data()

                    if data is None:
                        break

                    log(f"LOGLEVEL: {data!r}")
                    send("200 OK")

                elif line == "LIST VOICES":
                    send("200 OK")

                elif line == "SET":
                    send("203 OK RECEIVING SETTINGS")

                    data = receive_data()

                    if data is None:
                        break

                    log(f"SETTINGS: {data!r}")
                    send("203 OK SETTINGS RECEIVED")

                elif line == "SPEAK":
                    send("202 OK SEND DATA")

                    data = receive_data()

                    if data is None:
                        break

                    log(f"SPEECH: {data!r}")

                    send("200 OK SPEAKING")
                    send("701 BEGIN")
                    send("702 END")

                elif line == "STOP":
                    send("703 STOP")

                elif line == "PAUSE":
                    send("704 PAUSE")

                elif line == "CANCEL":
                    send("703 STOP")

                elif line in ("QUIT", "END"):
                    send("210 OK QUIT")
                    break

                else:
                    log(f"UNKNOWN: {line!r}")
                    send("200 OK")
            PY

            chmod +x "${SPEECHD_DIR}/modules/guidepup"

            # ------------------------------------------------------------
            # Custom module configuration
            # ------------------------------------------------------------

            cat > "${SPEECHD_DIR}/modules/guidepup.conf" <<'EOF'
            # Guidepup Speech Dispatcher module configuration
            EOF
      # TODO: update @guidepup/setup to support linux + orca
      # - run: npx -y @guidepup/setup@0.24.1 setup --ci
      - run: npm ci --no-audit --no-fund --no-progress
      - run: npm ci --prefix ./examples/playwright-orca --no-audit --no-fund --no-progress
      - run: npm --prefix ./examples/playwright-orca rebuild ffmpeg-static --ignore-scripts=false
      - run: npm --prefix ./examples/playwright-orca run browsers
      # TODO: update @guidepup/setup to support linux + orca
      # - run: npx -y @guidepup/setup@0.24.1 install
      - run: xvfb-run -a npm --prefix ./examples/playwright-orca run test:${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: artifacts-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            **/test-results/**/*
            **/recordings/**/*
