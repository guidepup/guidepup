name: Playwright NVDA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-nvda:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 setup --ci
      - run: npm ci --no-audit --no-fund --no-progress
      - run: npm ci --prefix ./examples/playwright-nvda --no-audit --no-fund --no-progress
      - run: npm --prefix ./examples/playwright-nvda rebuild ffmpeg-static --ignore-scripts=false
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
      - run: npm --prefix ./examples/playwright-nvda run browsers
      - run: npm --prefix ./examples/playwright-nvda run test:${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: artifacts-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            **/test-results/**/*
            **/recordings/**/*
