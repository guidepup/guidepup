name: Playwright Screen Reader

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright-screenreader-chromium:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27, windows-2022, windows-2025]
        browser: [chromium]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 setup --ci --macos-record
      - run: npm ci --no-audit --no-fund --no-progress
      - run: npm ci --prefix ./examples/playwright-screenreader --no-audit --no-fund --no-progress
      - run: npm --prefix ./examples/playwright-screenreader rebuild ffmpeg-static --ignore-scripts=false
      - run: npm --prefix ./examples/playwright-screenreader run browsers
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
      - run: npm --prefix ./examples/playwright-screenreader run test:${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: artifacts-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            **/test-results/**/*
            **/recordings/**/*

  playwright-screenreader-firefox:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        browser: [firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 setup --ci
      - run: npm ci --no-audit --no-fund --no-progress
      - run: npm ci --prefix ./examples/playwright-screenreader --no-audit --no-fund --no-progress
      - run: npm --prefix ./examples/playwright-screenreader rebuild ffmpeg-static --ignore-scripts=false
      - run: npm --prefix ./examples/playwright-screenreader run browsers
      - run: npx -y --min-release-age=0 --ignore-scripts=false @guidepup/setup@0.29.2 install
      - run: xvfb-run dbus-run-session -- npm --prefix ./examples/playwright-screenreader run test:${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: artifacts-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            **/test-results/**/*
            **/recordings/**/*
